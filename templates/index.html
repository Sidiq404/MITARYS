<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MITARYS AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style/style.css">
</head>
<body>

<div class="app">

  <aside class="rail" id="rail">
    <div class="rail-tete">
      <div class="bloc-logo">
          <div class="logo-boite"><img class="logo-img" src="/static/img/logo.png" alt="MITARYS"></div>
          <div class="marque">MIT<span class="lambda">&#923;</span>RYS</div>
      </div>
    </div>


    <button class="btn-neuf" onclick="nouvelleConversation()">
      <span class="plus">+</span> Nouvelle conversation
    </button>

    <div class="rail-titre">Historique</div>
    <nav class="historique" id="historique"></nav>

    <div class="rail-pied">
      <span class="pastille" id="pastille"></span>
      <span id="etatAgents">4 agents en ligne</span>
    </div>
  </aside>

  <main class="principal">
    <div class="barre">
      <button class="bascule" onclick="basculerRail()" aria-label="Afficher ou masquer l'historique">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/>
        </svg>
      </button>
      <div class="barre-titre" id="barreTitre">Nouvelle conversation</div>
    </div>

    <div class="flux" id="flux">
      <div class="vide" id="vide">
        <div class="vide-marque">MIT<span class="lambda">&#923;</span>RYS</div>
        <div class="vide-quali" id="videQuali"></div>
      </div>
      <div class="piste" id="piste"></div>
    </div>

    <div class="compo-zone">

    <div class="compo-zone">
      <div class="compo">
        <div class="compo-haut">
          <textarea id="saisie" rows="1" placeholder="Décris ce que tu cherches…"
                    oninput="ajusterHauteur(this)" onkeydown="toucheEntree(event)"></textarea>
          <button class="envoyer" id="btnEnvoyer" onclick="envoyer()" disabled aria-label="Envoyer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>

        <div class="compo-bas" id="extensions"></div>
      </div>
      <div class="mention">Vérifiez les prix chez le marchand — ils changent vite.</div>
    </div>
  </main>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
