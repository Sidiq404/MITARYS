<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MITARYS AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#08080C;
  --fond:#0C0C12;
  --carte:#12121A;
  --carte-haut:#191922;
  --filet:#22222E;
  --filet-clair:#2E2E3D;

  --violet:#A78BFA;
  --violet-vif:#8B5CF6;
  --violet-sourd:#6D28D9;
  --degrade:linear-gradient(165deg,#EDE9FE 0%,#A78BFA 55%,#7C3AED 100%);

  --texte:#F4F3F8;
  --texte-2:#A5A3B8;
  --texte-3:#6B6980;

  --titre:"Inter Tight",system-ui,sans-serif;
  --corps:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;

  --rail:296px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}

body{
  background:var(--fond);
  color:var(--texte);
  font-family:var(--corps);
  font-size:15px;
  line-height:1.6;
  letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,textarea:focus-visible,a:focus-visible{
  outline:2px solid var(--violet);outline-offset:2px;
}

.app{display:flex;height:100vh}

/* ================= LOGO ================= */
.logo-boite{display:grid;place-items:center;flex-shrink:0}
.logo-img{width:100%;height:100%;object-fit:contain;display:block}

.logo-boite.tourne .logo-img{
  animation:rotation 2.6s cubic-bezier(.62,.04,.36,1) infinite;
}
@keyframes rotation{
  0%   {transform:rotate(0deg)   scale(1)}
  50%  {transform:rotate(180deg) scale(.88)}
  100% {transform:rotate(360deg) scale(1)}
}

/* ================= RAIL ================= */
.rail{
  width:var(--rail);flex-shrink:0;
  background:var(--noir);
  border-right:1px solid var(--filet);
  display:flex;flex-direction:column;
  transition:margin-left .3s cubic-bezier(.4,0,.2,1);
}
.rail.replie{margin-left:calc(var(--rail) * -1)}

.rail-tete{padding:18px 18px 16px}
.bloc-logo{display:flex;align-items:center;gap:11px}
.bloc-logo .logo-boite{width:34px;height:34px}
.marque{
  font-family:var(--titre);
  font-size:17px;font-weight:600;
  letter-spacing:.15em;line-height:1;
}
.marque .lambda{font-weight:500}

.btn-neuf{
  margin:2px 14px 6px;padding:11px 14px;
  border:1px solid var(--filet);border-radius:11px;
  font-family:var(--titre);
  font-size:14px;font-weight:500;text-align:left;
  display:flex;align-items:center;gap:10px;
  transition:border-color .2s,background .2s;
}
.btn-neuf:hover{border-color:var(--filet-clair);background:var(--carte)}
.btn-neuf .plus{
  width:18px;height:18px;flex-shrink:0;
  border-radius:6px;background:var(--degrade);
  display:grid;place-items:center;
  color:var(--noir);font-size:14px;font-weight:700;line-height:1;
}

.rail-titre{
  font-family:var(--mono);
  font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--texte-3);
  padding:20px 20px 10px;
}

.historique{flex:1;overflow-y:auto;padding:0 12px 16px;display:flex;flex-direction:column;gap:7px}
.historique::-webkit-scrollbar{width:5px}
.historique::-webkit-scrollbar-thumb{background:var(--filet);border-radius:3px}

/* ---- cartes d'historique ---- */
.carte-fil{
  position:relative;
  width:100%;text-align:left;
  padding:12px 13px 11px;
  border-radius:12px;
  background:var(--carte);
  border:1px solid var(--filet);
  overflow:hidden;
  transition:transform .22s cubic-bezier(.34,1.4,.64,1),
             border-color .22s, background .22s;
}
.carte-fil::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--degrade);
  transform:scaleY(0);transform-origin:top;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.carte-fil:hover{
  transform:translateX(3px);
  border-color:var(--filet-clair);
  background:var(--carte-haut);
}
.carte-fil:hover::before{transform:scaleY(1)}
.carte-fil.actif{background:var(--carte-haut);border-color:var(--violet-sourd)}
.carte-fil.actif::before{transform:scaleY(1)}

.carte-titre{
  font-family:var(--titre);
  font-size:13.5px;font-weight:500;line-height:1.35;
  color:var(--texte);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
  margin-bottom:7px;
}
.carte-meta{
  display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:9.5px;
  color:var(--texte-3);letter-spacing:.03em;
}
.carte-meta .sep{width:2px;height:2px;border-radius:50%;background:var(--texte-3)}
.carte-meta .jeter{
  margin-left:auto;
  font-family:var(--corps);font-size:15px;line-height:1;
  color:var(--texte-3);
  padding:0 2px;border-radius:4px;
  opacity:0;transition:opacity .18s,color .18s;
}
.carte-fil:hover .jeter{opacity:1}
.carte-meta .jeter:hover{color:#C88A8A}
.carte-modele{
  color:var(--violet);
  padding:1px 5px;border-radius:4px;
  background:rgba(167,139,250,.1);
  border:1px solid rgba(167,139,250,.18);
}

.rail-pied{
  padding:13px 20px 16px;border-top:1px solid var(--filet);
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;
  color:var(--texte-3);
  display:flex;align-items:center;gap:8px;
}
.pastille{
  width:6px;height:6px;border-radius:50%;background:var(--violet);
  box-shadow:0 0 0 3px rgba(167,139,250,.13);
}
.pastille.actif{animation:battement 1.5s ease-in-out infinite}
@keyframes battement{
  0%,100%{box-shadow:0 0 0 3px rgba(167,139,250,.13)}
  50%    {box-shadow:0 0 0 8px rgba(167,139,250,.03)}
}

/* ================= PRINCIPAL ================= */
.principal{flex:1;display:flex;flex-direction:column;min-width:0}

.barre{
  height:56px;flex-shrink:0;
  display:flex;align-items:center;gap:14px;padding:0 22px;
  border-bottom:1px solid var(--filet);
}
.bascule{
  width:30px;height:30px;border-radius:8px;
  display:grid;place-items:center;color:var(--texte-2);
  transition:color .18s,background .18s;
}
.bascule:hover{color:var(--texte);background:var(--carte)}
.barre-titre{
  font-family:var(--titre);
  font-size:14px;font-weight:500;color:var(--texte-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.flux{flex:1;overflow-y:auto;scroll-behavior:smooth;display:flex;flex-direction:column}
.flux::-webkit-scrollbar{width:9px}
.flux::-webkit-scrollbar-thumb{background:var(--filet);border-radius:5px}
.piste{max-width:780px;width:100%;margin:0 auto;padding:36px 26px 30px}

/* ================= ECRAN VIDE ================= */
.vide{
  min-height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:40px 26px;
  animation:monte .55s cubic-bezier(.4,0,.2,1) both;
}
.vide-marque{
  font-family:var(--titre);
  font-size:clamp(46px,8vw,86px);
  font-weight:600;
  letter-spacing:.055em;
  line-height:1;
  text-align:center;
  background:var(--degrade);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.vide-marque .lambda{
  font-weight:500;
  letter-spacing:.02em;
}

/* ================= MESSAGES ================= */
.msg{margin-bottom:30px;animation:monte .36s cubic-bezier(.4,0,.2,1) both}

.msg-toi{display:flex;justify-content:flex-end}
.msg-toi .msg-corps{
  max-width:82%;
  background:var(--carte);
  border:1px solid var(--filet);
  padding:13px 17px;border-radius:16px 16px 4px 16px;
  font-size:15px;
}

.msg-ia .msg-etiq{margin-bottom:12px}
.msg-ia .msg-etiq .logo-boite{width:34px;height:34px}
.msg-ia .msg-corps{
  font-size:15.5px;line-height:1.75;color:var(--texte);
}
.msg-corps p{margin-bottom:14px}
.msg-corps p:last-child{margin-bottom:0}
.msg-corps strong{
  color:var(--violet);font-weight:600;
}
.msg-corps a{
  color:var(--texte-2);text-decoration:none;
  border-bottom:1px solid var(--filet-clair);
  font-size:13.5px;word-break:break-all;
}
.msg-corps a:hover{color:var(--violet);border-bottom-color:var(--violet)}
.msg-corps .horo{font-family:var(--mono);font-size:10.5px;color:var(--texte-3)}

/* ================= FLOW AGENTS ================= */
.flow{
  border:1px solid var(--filet);
  border-radius:16px;
  background:var(--carte);
  overflow:hidden;
}
.flow-tete{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 17px;
  border-bottom:1px solid var(--filet);
  font-family:var(--mono);
  font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--texte-3);
}
.flow-tete .compteur{color:var(--violet)}

.flow-corps{padding:15px 17px 6px;position:relative}
.flow-corps::before{
  content:"";position:absolute;left:22px;top:24px;bottom:20px;
  width:1px;background:var(--filet);
}
.flow-corps::after{
  content:"";position:absolute;left:22px;top:24px;width:1px;
  height:var(--rail-h,0px);
  background:linear-gradient(180deg,#EDE9FE,#A78BFA,#7C3AED);
  transition:height .6s cubic-bezier(.4,0,.2,1);
}

.bloc{
  display:flex;gap:14px;
  padding-bottom:16px;
  position:relative;
  opacity:.32;
  transition:opacity .4s ease;
}
.bloc.vu{opacity:1}

.bloc .puce{
  width:11px;height:11px;flex-shrink:0;margin-top:4px;
  border-radius:50%;
  background:var(--carte);
  border:1.5px solid var(--filet-clair);
  position:relative;z-index:1;
  transition:border-color .35s,background .35s,transform .4s cubic-bezier(.34,1.5,.64,1);
}
.bloc.encours .puce{
  border-color:var(--violet);background:var(--violet);
  transform:scale(1.3);
  box-shadow:0 0 0 5px rgba(167,139,250,.14);
}
.bloc.faite .puce{border-color:var(--violet-sourd);background:var(--violet-sourd)}

.bloc-txt{flex:1;min-width:0}
.bloc-nom{
  font-family:var(--titre);
  font-size:13.5px;font-weight:500;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
}
.bloc-nom .verdict{
  font-family:var(--mono);font-size:10px;
  color:var(--texte-3);white-space:nowrap;
  opacity:0;transition:opacity .45s;
}
.bloc.vu .verdict{opacity:1}

/* requêtes lancées */
.requetes{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.requete{
  display:flex;align-items:center;gap:9px;
  padding:7px 11px;
  background:var(--carte-haut);
  border:1px solid var(--filet);
  border-radius:9px;
  font-size:12px;color:var(--texte-2);
  animation:glisse .4s cubic-bezier(.4,0,.2,1) both;
}
.requete .loupe{color:var(--violet);flex-shrink:0;opacity:.85}
.requete .q{
  flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono);font-size:11px;
}
.requete .n{
  font-family:var(--mono);font-size:10px;
  color:var(--violet);flex-shrink:0;
  padding:1px 6px;border-radius:4px;
  background:rgba(167,139,250,.1);
}

/* domaines écartés */
.domaines{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.domaine{
  font-family:var(--mono);font-size:10px;
  padding:3px 8px;border-radius:6px;
  background:rgba(180,60,60,.07);
  border:1px solid rgba(180,60,60,.16);
  color:#C88A8A;
  animation:glisse .3s cubic-bezier(.4,0,.2,1) both;
}
.domaine s{text-decoration-color:rgba(200,138,138,.5)}

/* sources retenues */
.sources{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.source{
  font-family:var(--mono);font-size:10px;
  padding:3px 8px;border-radius:6px;
  background:var(--carte-haut);
  border:1px solid var(--filet);
  color:var(--texte-2);
  animation:glisse .3s cubic-bezier(.4,0,.2,1) both;
}

/* pied du flow : logo qui tourne */
.flow-pied{
  display:flex;align-items:center;gap:11px;
  padding:13px 17px;
  border-top:1px solid var(--filet);
  background:var(--noir);
}
.flow-pied .logo-boite{width:26px;height:26px}
.flow-pied .mot{
  font-family:var(--mono);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--violet);
}

@keyframes glisse{
  from{opacity:0;transform:translateX(-8px)}
  to  {opacity:1;transform:none}
}

/* ================= COMPOSITEUR ================= */
.compo-zone{
  flex-shrink:0;padding:0 26px 22px;
  background:linear-gradient(to top,var(--fond) 66%,transparent);
}
.compo{
  max-width:780px;margin:0 auto;
  background:var(--carte);
  border:1px solid var(--filet);
  border-radius:18px;
  transition:border-color .2s,box-shadow .2s;
}
.compo:focus-within{
  border-color:var(--violet-sourd);
  box-shadow:0 0 0 3px rgba(124,58,237,.08);
}
.compo-haut{
  display:flex;align-items:flex-end;gap:10px;
  padding:13px 13px 8px 18px;
}
.compo textarea{
  flex:1;background:none;border:none;outline:none;resize:none;
  color:var(--texte);font-family:inherit;
  font-size:15.5px;line-height:1.55;
  max-height:180px;padding:4px 0;
}
.compo textarea::placeholder{color:var(--texte-3)}
.envoyer{
  width:34px;height:34px;flex-shrink:0;
  background:var(--degrade);color:var(--noir);
  border-radius:10px;display:grid;place-items:center;
  transition:transform .18s,opacity .18s;
}
.envoyer:hover:not(:disabled){transform:translateY(-1px)}
.envoyer:disabled{opacity:.22;cursor:not-allowed}

/* --- barre d'extensions dans le compositeur --- */
.compo-bas{
  display:flex;align-items:center;gap:7px;
  padding:0 13px 11px 14px;
  flex-wrap:wrap;
}

.ext{
  display:flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:9px;
  border:1px solid var(--filet);
  font-size:12px;color:var(--texte-2);
  transition:border-color .18s,color .18s,background .18s;
}
.ext:hover{border-color:var(--filet-clair);color:var(--texte)}
.ext.on{
  border-color:var(--violet-sourd);
  background:rgba(124,58,237,.1);
  color:var(--violet);
}
.ext svg{flex-shrink:0}

.choix-modele{position:relative;margin-left:auto}
.btn-modele{
  display:flex;align-items:center;gap:7px;
  padding:5px 10px;border-radius:9px;
  border:1px solid var(--filet);
  font-size:12px;
  transition:border-color .18s;
}
.btn-modele:hover{border-color:var(--filet-clair)}
.btn-modele .nom{
  font-family:var(--titre);font-weight:600;letter-spacing:.02em;
  background:var(--degrade);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.btn-modele .fleche{color:var(--texte-3);transition:transform .2s}
.choix-modele.ouvert .fleche{transform:rotate(180deg)}

.menu-modele{
  position:absolute;bottom:calc(100% + 8px);right:0;
  width:282px;
  background:var(--carte);
  border:1px solid var(--filet-clair);
  border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  padding:6px;z-index:40;
  opacity:0;visibility:hidden;transform:translateY(6px);
  transition:opacity .2s,transform .2s,visibility .2s;
}
.choix-modele.ouvert .menu-modele{opacity:1;visibility:visible;transform:none}

.option{
  width:100%;text-align:left;
  padding:10px 11px;border-radius:10px;
  display:flex;gap:11px;align-items:flex-start;
  transition:background .16s;
}
.option:hover{background:var(--carte-haut)}
.option .coche{
  width:14px;flex-shrink:0;margin-top:3px;
  color:var(--violet);opacity:0;transition:opacity .16s;
}
.option.actif .coche{opacity:1}
.option-nom{
  font-family:var(--titre);
  font-size:13.5px;font-weight:600;line-height:1.3;
}
.option-desc{
  font-size:11.5px;color:var(--texte-3);
  line-height:1.45;margin-top:3px;
}
.badge{
  font-family:var(--mono);font-size:8px;letter-spacing:.09em;
  padding:2px 5px;border-radius:4px;
  background:var(--degrade);color:var(--noir);
  margin-left:7px;vertical-align:2px;font-weight:500;
}

.mention{
  max-width:780px;margin:10px auto 0;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;
  color:var(--texte-3);text-align:center;
}

@keyframes monte{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  .flux{scroll-behavior:auto}
}

@media (max-width:860px){
  .rail{position:fixed;inset:0 auto 0 0;z-index:30;box-shadow:0 0 50px rgba(0,0,0,.7)}
  .piste,.vide{padding-left:18px;padding-right:18px}
  .compo-zone{padding:0 14px 16px}
  .ext .libelle{display:none}
}
</style>
</head>
<body>

<div class="app">

  <aside class="rail" id="rail">
    <div class="rail-tete">
      <div class="bloc-logo">
        <div class="logo-boite"><img class="logo-img" src="/static/img/logo.png" alt="MITARYS"></div>
        <div class="marque">MIT<span class="lambda">&#923;</span>RYS</div>
      </div>
    </div>

    <button class="btn-neuf" onclick="nouvelleConversation()">
      <span class="plus">+</span> Nouvelle conversation
    </button>

    <div class="rail-titre">Historique</div>
    <nav class="historique" id="historique"></nav>

    <div class="rail-pied">
      <span class="pastille" id="pastille"></span>
      <span id="etatAgents">4 agents en ligne</span>
    </div>
  </aside>

  <main class="principal">
    <div class="barre">
      <button class="bascule" onclick="basculerRail()" aria-label="Afficher ou masquer l'historique">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/>
        </svg>
      </button>
      <div class="barre-titre" id="barreTitre">Nouvelle conversation</div>
    </div>

    <div class="flux" id="flux">
      <div class="vide" id="vide">
        <div class="vide-marque">MIT<span class="lambda">&#923;</span>RYS</div>
      </div>
      <div class="piste" id="piste"></div>
    </div>

    <div class="compo-zone">
      <div class="compo">
        <div class="compo-haut">
          <textarea id="saisie" rows="1" placeholder="Décris ce que tu cherches…"
                    oninput="ajusterHauteur(this)" onkeydown="toucheEntree(event)"></textarea>
          <button class="envoyer" id="btnEnvoyer" onclick="envoyer()" disabled aria-label="Envoyer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>

        <div class="compo-bas" id="extensions"></div>
      </div>
      <div class="mention">Vérifiez les prix chez le marchand — ils changent vite.</div>
    </div>
  </main>
</div>

<script>
/* =======================================================
   ÉTAT
   ======================================================= */
let conversations    = [];
let messagesCourants = [];
let idCourant        = null;
let occupe           = false;

/* ---------- EXTENSIONS ---------- */
const EXTENSIONS = [
  { id:"web",     nom:"Recherche web", on:true,
    icone:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>' },
  { id:"memoire", nom:"Mémoire", on:true,
    icone:'<path d="M12 3a4 4 0 0 0-4 4v1a3 3 0 0 0 0 6v2a4 4 0 0 0 8 0v-2a3 3 0 0 0 0-6V7a4 4 0 0 0-4-4z"/>' },

];

const nomModele = () => MODELES.find(m => m.id === modeleActif).nom;

  { q:"whey protein price comparison Canada 2026",  n:8 },
  { q:"Gold Standard vs Impact Whey cost per gram", n:6 },
  { q:"Informed Sport certified whey Canada",       n:7 }
];

/* =======================================================
   CONSTRUCTION DE L'INTERFACE
   ======================================================= */
function dessinerExtensions(){
  const zone = document.getElementById("extensions");
  zone.innerHTML = "";

  EXTENSIONS.forEach(x => {
    const b = document.createElement("button");
    b.className = "ext" + (x.on ? " on" : "");

function dessinerMenuModele(){
  const menu = document.getElementById("menuModele");

  menu.innerHTML = "";

    const b = document.createElement("button");
    b.className = "option" + (m.id === modeleActif ? " actif" : "");

        <span class="option-desc">${m.desc}</span>

    b.onclick = e => { e.stopPropagation(); choisirModele(m.id); };
    menu.appendChild(b);
  });
}

function basculerMenu(e){
  e.stopPropagation();
  document.getElementById("choixModele").classList.toggle("ouvert");
}

function choisirModele(id){
  modeleActif = id;
  document.getElementById("modeleActif").textContent = nomModele();
  document.getElementById("choixModele").classList.remove("ouvert");
  dessinerMenuModele();
}

document.addEventListener("click", () => {
  const c = document.getElementById("choixModele");
  if(c) c.classList.remove("ouvert");
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    const c = document.getElementById("choixModele");

  }
});

/* =======================================================
   NAVIGATION
   ======================================================= */
function basculerRail(){
  document.getElementById("rail").classList.toggle("replie");
}

function ajusterHauteur(t){
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 180) + "px";
  document.getElementById("btnEnvoyer").disabled = !t.value.trim() || occupe;
}

function toucheEntree(e){
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); envoyer(); }
}

function nouvelleConversation(){
  idCourant = null;
  messagesCourants = [];
  document.getElementById("piste").innerHTML = "";
  document.getElementById("vide").style.display = "flex";
  document.getElementById("barreTitre").textContent = "Nouvelle conversation";
  dessinerHistorique();
  if(window.innerWidth <= 860) document.getElementById("rail").classList.add("replie");
}

function heure(ts){
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,"0") + ":" +
         d.getMinutes().toString().padStart(2,"0");
}

async function chargerHistorique(){
  try{
    const r = await fetch("/api/conversations");
    conversations = await r.json();
  }catch(e){
    conversations = [];
  }
  dessinerHistorique();
}

function dessinerHistorique(){
  const nav = document.getElementById("historique");
  nav.innerHTML = "";
  conversations.forEach(c => {
    const b = document.createElement("button");
    b.className = "carte-fil" + (c.id === idCourant ? " actif" : "");
    const nb = Math.ceil((c.nb_messages || 0) / 2) || 1;
    b.innerHTML = `
      <div class="carte-titre">${echapper(c.titre)}</div>
      <div class="carte-meta">
        <span class="carte-modele">${c.modele}</span>
        <span class="sep"></span>
        <span>${nb} échange${nb > 1 ? "s" : ""}</span>
        <span class="sep"></span>
        <span>${heure(c.creee_le * 1000)}</span>
        <span class="jeter" title="Supprimer">&#215;</span>
      </div>`;
    b.onclick = () => ouvrirConversation(c.id);
    b.querySelector(".jeter").onclick = e => {
      e.stopPropagation();
      supprimerConversation(c.id);
    };
    nav.appendChild(b);
  });
}

async function supprimerConversation(id){
  try{ await fetch("/api/conversations/" + id, { method:"DELETE" }); }catch(e){}
  if(id === idCourant) nouvelleConversation();
  else await chargerHistorique();
}

async function ouvrirConversation(id){
  const c = conversations.find(x => x.id === id);
  if(!c) return;
  idCourant = id;
  document.getElementById("vide").style.display = "none";
  document.getElementById("barreTitre").textContent = c.titre;

  const piste = document.getElementById("piste");
  piste.innerHTML = "";

  try{
    const r  = await fetch("/api/conversations/" + id);
    const ms = await r.json();
    messagesCourants = ms;
    ms.forEach(m => {
      const html = m.role === "user" ? echapper(m.contenu) : formater(m.contenu);
      piste.appendChild(construireMessage(m.role, html));
    });
  }catch(e){}

  dessinerHistorique();
  versLeBas();
  if(window.innerWidth <= 860) document.getElementById("rail").classList.add("replie");
}

   MESSAGES
   ======================================================= */

  const el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "msg-toi" : "msg-ia");
  if(role === "user"){

    el.innerHTML = `
      <div class="msg-etiq">
        <div class="logo-boite"><img class="logo-img" src="/static/img/logo.png" alt="MITARYS AI"></div>
      </div>
      <div class="msg-corps">${html}</div>`;
  }
  return el;
}

/* =======================================================
   FLOW DES AGENTS
   ======================================================= */
const BLOCS = [
  { cle:"memoire",  nom:"Consultation de la mémoire" },
  { cle:"recherche",nom:"Recherche sur le web" },
  { cle:"filtrage", nom:"Filtrage des sources" },
  { cle:"synthese", nom:"Synthèse et rédaction" }
];

function construireFlow(){
  const el = document.createElement("div");
  el.className = "msg msg-ia";
  el.innerHTML = `
    <div class="flow" id="flow">
      <div class="flow-tete">
        <span>Chaîne d'agents · ${nomModele()}</span>
        <span class="compteur" id="chrono">0.0 s</span>
      </div>
      <div class="flow-corps" id="flowCorps">
        ${BLOCS.map(b => `
          <div class="bloc" id="bl-${b.cle}">

            <span class="bloc-txt">

      </div>

        <span class="mot">${nomModele()} réfléchit</span>

  return el;
}

function activerBloc(cle, termine){
  const el = document.getElementById("bl-" + cle);
  if(!el) return;
  el.classList.add("vu");
  el.classList.remove("encours");
  el.classList.add(termine ? "faite" : "encours");

  const zone = document.getElementById("flowCorps");
  if(zone){
    const haut  = zone.getBoundingClientRect().top + 24;
    const cible = el.getBoundingClientRect().top + 9;
    zone.style.setProperty("--rail-h", Math.max(0, cible - haut) + "px");
  }
}

function verdict(cle, texte){
  const el = document.getElementById("vd-" + cle);
  if(el) el.textContent = texte;
}

function ajouterRequete(texte, nb){
  const zone = document.getElementById("zn-recherche");
  if(!zone) return;
  zone.classList.add("requetes");
  const el = document.createElement("span");
  el.className = "requete";
  el.innerHTML = `
    <svg class="loupe" width="11" height="11" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
    </svg>
    <span class="q">${echapper(texte)}</span>
    <span class="n">${nb}</span>`;
  zone.appendChild(el);
  versLeBas();
}

function ajouterPuces(cle, liste, classe){
  const zone = document.getElementById("zn-" + cle);
  if(!zone) return;
  zone.className = classe === "domaine" ? "domaines" : "sources";
  liste.forEach((d, i) => {
    setTimeout(() => {
      const el = document.createElement("span");
      el.className = classe;
      el.innerHTML = classe === "domaine" ? `<s>${d}</s>` : d;
      zone.appendChild(el);
      versLeBas();
    }, i * 130);
  });
}

function versLeBas(){
  const f = document.getElementById("flux");
  f.scrollTop = f.scrollHeight;
}

function etatAgents(actif){
  const p = document.getElementById("pastille");
  if(p) p.classList.toggle("actif", actif);
  const e = document.getElementById("etatAgents");
  if(e) e.textContent = actif ? "agents au travail…" : "4 agents en ligne";

/* =======================================================
   ENVOI
   ======================================================= */
async function envoyer(){
  const saisie = document.getElementById("saisie");
  const texte  = saisie.value.trim();
  if(!texte || occupe) return;

  occupe = true;
  document.getElementById("vide").style.display = "none";
  saisie.value = "";
  ajusterHauteur(saisie);

  const piste = document.getElementById("piste");
  piste.appendChild(construireMessage("user", echapper(texte)));
  versLeBas();

  if(!idCourant){
    idCourant = Date.now();
    document.getElementById("barreTitre").textContent = texte;
  }
  messagesCourants.push({ role:"user", contenu: texte });

  const flow = construireFlow();
  piste.appendChild(flow);
  versLeBas();

  etatAgents(true);
  const arreterChrono = lancerChrono();

  let reponse;
  try{
    reponse = await derouler(texte);
  }catch(err){
    reponse = `<p>Le serveur n'a pas repondu. Verifie que <code>app.py</code>
               tourne, puis relance la question.</p>
               <p class="horo">${echapper(String(err.message || err))}</p>`;
  }

  arreterChrono();
  etatAgents(false);
  flow.remove();
  piste.appendChild(construireMessage("ia", reponse));
  messagesCourants.push({ role:"ia", contenu: reponse });
  await chargerHistorique();

  occupe = false;
  versLeBas();
  saisie.focus();
}

function lancerChrono(){
  const debut = Date.now();
  const t = setInterval(() => {
    const el = document.getElementById("chrono");
    if(el) el.textContent = ((Date.now() - debut)/1000).toFixed(1) + " s";
  }, 100);
  return () => clearInterval(t);
}

/* =======================================================
   APPEL DU SERVEUR — flux d'evenements en direct
   ======================================================= */
async function derouler(question){
  // historique envoye au serveur (hors message courant, deja empile)
  const hist = messagesCourants.slice(0, -1).map(m => ({
    role   : m.role === "user" ? "user" : "assistant",
    content: m.contenu
  })).slice(-10);

  const reponse = await fetch("/api/chat", {
    method : "POST",
    headers: { "Content-Type": "application/json" },
    body   : JSON.stringify({
      message        : question,
      modele         : modeleActif,
      historique     : hist,
      conversation_id: idCourant
    })
  });

  if(!reponse.ok) throw new Error("HTTP " + reponse.status);

  const lecteur = reponse.body.getReader();
  const decodeur = new TextDecoder();
  let tampon = "";
  let texteFinal = "";

  while(true){
    const { done, value } = await lecteur.read();
    if(done) break;

    tampon += decodeur.decode(value, { stream: true });
    const lignes = tampon.split("\n");
    tampon = lignes.pop();

    for(const ligne of lignes){
      if(!ligne.trim()) continue;
      let e;
      try { e = JSON.parse(ligne); } catch { continue; }

      if(e.erreur && !e.etape){ throw new Error(e.erreur); }
      if(e.reponse !== undefined){ texteFinal = e.reponse; continue; }

      traiterEvenement(e);
    }
  }

  return formater(texteFinal);
}

/* Applique un evenement du serveur au panneau des agents */
function traiterEvenement(e){
  const etape = e.etape;
  if(!etape) return;

  if(e.statut === "debut") activerBloc(etape, false);
  if(e.requete)            ajouterRequete(e.requete, e.n || 0);
  if(e.domaines && e.domaines.length) ajouterPuces("filtrage", e.domaines, "domaine");
  if(e.sources  && e.sources.length)  ajouterPuces("synthese", e.sources,  "source");
  if(e.verdict){
    verdict(etape, e.verdict);
    if(e.statut === "fin") activerBloc(etape, true);
  }
  versLeBas();
}

/* Markdown minimal : **gras**, URLs, [dates], paragraphes */
function formater(t){
  if(!t) return "<p>Aucune reponse recue.</p>";
  return echapper(t)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\((https?:\/\/[^\s)]+)\)/g,
             '(<a href="$1" target="_blank" rel="noopener">$1</a>)')
    .replace(/\[([^\]]+)\]/g, '<span class="horo">[$1]</span>')
    .split(/\n{2,}/)
    .map(p => "<p>" + p.replace(/\n/g, "<br>") + "</p>")
    .join("");
}

function echapper(t){
  const d = document.createElement("div");
  d.textContent = t;
  return d.innerHTML;
}

dessinerExtensions();
chargerHistorique();
